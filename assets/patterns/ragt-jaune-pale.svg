  <!-- Layer 2: Main crisp luminous stroke -->
  <g fill="none" stroke="#FFF5C4" stroke-width="3" stroke-linecap="round" stroke-linejoin="miter" opacity="0.90">
    <path d="M800 0 L765 70 L1060 60"/>
