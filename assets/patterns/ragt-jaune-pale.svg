<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="1024" height="512" role="img" aria-label="Motif institutionnel RAGT jaune pâle">
  <defs>
    <linearGradient id="ragtYellowBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDC420"/>
      <stop offset="100%" stop-color="#EDB822"/>
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="1024" height="512" fill="url(#ragtYellowBg)"/>

  <!-- Pale yellow geometric motifs (authentic RAGT communication card framing) -->
  <!-- Layer 1: Soft warm yellow glow -->
  <g fill="none" stroke="#FFE27F" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <polyline points="418,-2 298,485 375,485"/>
    <polyline points="808,-2 785,68 1026,46"/>
    <polyline points="1026,62 924,480 938,514"/>
    <polyline points="-2,485 50,485"/>
  </g>

  <!-- Layer 2: Main crisp luminous pale cream stroke -->
  <g fill="none" stroke="#FFF3AD" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <polyline points="418,-2 298,485 375,485"/>
    <polyline points="808,-2 785,68 1026,46"/>
    <polyline points="1026,62 924,480 938,514"/>
    <polyline points="-2,485 50,485"/>
  </g>
</svg>
