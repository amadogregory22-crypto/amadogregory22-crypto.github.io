[project]
name = "signature-studio-backend"
version = "0.1.0"
description = "FastAPI Backend for Signature Studio - OCR, Computer Vision & Outlook Generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.28",
    "pillow>=10.2.0",
    "opencv-python-headless>=4.9.0",
    "pytesseract>=0.3.10",
    "numpy>=1.26.0",
    "aiofiles>=23.2.1",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
