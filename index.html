<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Accès Non Autorisé</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f8fafc;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 40px;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .badge {
      display: inline-block;
      background: #fee2e2;
      color: #991b1b;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 12px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #64748b;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Accès Restreint</div>
    <h1>Application Hors Ligne</h1>
    <p>Ce service public a été définitivement désactivé conformément aux exigences de sécurité et de confidentialité. L'application est exploitée exclusivement en réseau local sécurisé.</p>
  </div>
</body>
</html>
